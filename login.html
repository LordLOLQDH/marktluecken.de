<!doctype html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Zugang zu Marktlücken.de"><title>Zugang · Marktlücken.de</title><link rel="icon" href="favicon.ico"><link rel="stylesheet" href="style.css?v=6"><style>.auth-wrap{min-height:calc(100vh - 160px);display:grid;place-items:center;padding:50px 6vw}.auth-card{width:min(520px,100%);background:#fff;border:1px solid #d8d8d2;border-radius:28px;padding:34px;box-shadow:0 18px 50px #0000000d}.auth-form{display:grid;gap:12px}.auth-form label{font-size:13px;font-weight:700}.auth-form input{width:100%;box-sizing:border-box;padding:15px;border:1px solid #ccc;border-radius:12px;background:#fff;font:inherit}.auth-button{border:0;background:#111;color:#fff;border-radius:12px;padding:15px;font:inherit;font-weight:700;cursor:pointer;margin-top:8px}.auth-message{min-height:22px;font-size:14px}.secret-admin{position:fixed;right:8px;bottom:8px;width:18px;height:18px;opacity:.01;border:0;background:transparent;cursor:pointer}</style></head><body><header class="header"><a class="logo" href="index.html">Marktlücken<span>.de</span></a><button class="menu-button" id="menuButton">☰</button><nav class="menu" id="menu" aria-hidden="true"><a href="explore.html">Marktlücken.explore</a><a href="login.html">Kundenbereich</a></nav></header><main class="auth-wrap"><section class="auth-card"><p class="eyebrow" id="authEyebrow">Zugang</p><h1 id="authTitle">Kundenbereich</h1><p class="intro" id="authIntro">Mit deinem Zugang kannst du geschützte Marktlücken entdecken.</p><form class="auth-form" id="authForm"><div id="nameField"><label for="name">Kundenname</label><input id="name" autocomplete="username" required></div><div><label for="password">Passwort</label><input id="password" type="password" autocomplete="current-password" required></div><button class="auth-button" type="submit">Einloggen →</button><p class="auth-message" id="authMessage"></p></form></section></main><footer><a href="index.html">Marktlücken.de</a><a href="explore.html">Marktlücken.explore</a></footer><button class="secret-admin" id="secretAdmin" aria-label="Administrationszugang"></button><script src="auth.js"></script><script src="script.js"></script><script>let mode='customer';const form=document.getElementById('authForm'),msg=document.getElementById('authMessage'),nameField=document.getElementById('nameField'),title=document.getElementById('authTitle'),intro=document.getElementById('authIntro');function setMode(m){mode=m;const admin=m==='admin';nameField.hidden=admin;document.getElementById('name').required=!admin;title.textContent=admin?'Administration':'Kundenbereich';intro.textContent=admin?'Geschützter Administrationszugang.':'Mit deinem Zugang kannst du geschützte Marktlücken entdecken.'}document.getElementById('secretAdmin').onclick=()=>setMode('admin');form.onsubmit=async e=>{e.preventDefault();msg.textContent='Anmeldung …';try{const data=await mlApi(mode==='admin'?'login-admin':'login-customer',mode==='admin'?{password:password.value}:{name:name.value,password:password.value});mlSetSession(data);location.href=mode==='admin'?'admin.html':'kunden.html'}catch(err){msg.textContent=err.message}};</script></body></html>
