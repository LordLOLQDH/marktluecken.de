<!doctype html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Administrationszugang zu Marktlücken.de"><title>Admin · Marktlücken.de</title><link rel="icon" href="favicon.ico"><link rel="stylesheet" href="style.css?v=10"><style>.auth-wrap{min-height:calc(100vh - 160px);display:grid;place-items:center;padding:50px 6vw}.auth-card{width:min(520px,100%);background:#fff;border:1px solid #d8d8d2;border-radius:28px;padding:34px;box-shadow:0 18px 50px #0000000d}.auth-form{display:grid;gap:12px}.auth-form label{font-size:13px;font-weight:700}.auth-form input{width:100%;box-sizing:border-box;padding:15px;border:1px solid #ccc;border-radius:12px;background:#fff;font:inherit}.auth-button{border:0;background:#111;color:#fff;border-radius:12px;padding:15px;font:inherit;font-weight:700;cursor:pointer;margin-top:8px}.auth-message{min-height:22px;font-size:14px}</style></head><body><header class="header"><a class="logo" href="index.html">Marktlücken<span>.de</span></a><button class="menu-button" id="menuButton">☰</button><nav class="menu" id="menu" aria-hidden="true"><a href="explore.html">Marktlücken.explore</a></nav></header><main class="auth-wrap"><section class="auth-card"><p class="eyebrow">Administration</p><h1>Admin-Login</h1><p class="intro">Nur der Administrator kann die Verwaltung öffnen.</p><form class="auth-form" id="authForm"><label for="password">Admin-Passwort</label><input id="password" type="password" autocomplete="current-password" required autofocus><button class="auth-button" type="submit">Anmelden →</button><p class="auth-message" id="authMessage" role="status" aria-live="polite"></p></form></section></main><footer><a href="index.html">Marktlücken.de</a><a href="explore.html">Marktlücken.explore</a><span class="copyright-secret" id="footerCopyright" title="© Marktlücken.de">© 2026 Marktlücken.de</span></footer><script src="auth.js?v=10"></script><script src="script.js"></script><script>document.getElementById('footerCopyright').onclick=()=>location.href='login.html?admin=1';document.getElementById('authForm').onsubmit=async e=>{e.preventDefault();const msg=document.getElementById('authMessage');msg.textContent='Anmeldung …';try{const data=await mlApi('login-admin',{password:document.getElementById('password').value});mlSetSession(data);location.href='admin.html'}catch(err){msg.textContent=err.message||'Anmeldung fehlgeschlagen.'}};</script></body></html>
