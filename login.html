<!doctype html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Zugang zu Marktlücken.de"><title>Zugang · Marktlücken.de</title><link rel="icon" href="favicon.ico"><link rel="stylesheet" href="style.css?v=8"><style>.auth-wrap{min-height:calc(100vh - 160px);display:grid;place-items:center;padding:50px 6vw}.auth-card{width:min(520px,100%);background:#fff;border:1px solid #d8d8d2;border-radius:28px;padding:34px;box-shadow:0 18px 50px #0000000d}.auth-form{display:grid;gap:12px}.auth-form label{font-size:13px;font-weight:700}.auth-form input{width:100%;box-sizing:border-box;padding:15px;border:1px solid #ccc;border-radius:12px;background:#fff;font:inherit}.auth-button{border:0;background:#111;color:#fff;border-radius:12px;padding:15px;font:inherit;font-weight:700;cursor:pointer;margin-top:8px}.auth-message{min-height:22px;font-size:14px}.login-copyright{margin-top:18px;text-align:center;font-size:12px;color:#777;cursor:pointer;user-select:none}</style></head><body><header class="header"><a class="logo" href="index.html">Marktlücken<span>.de</span></a><button class="menu-button" id="menuButton">☰</button><nav class="menu" id="menu" aria-hidden="true"><a href="explore.html">Marktlücken.explore</a></nav></header><main class="auth-wrap"><section class="auth-card"><p class="eyebrow" id="authEyebrow">Zugang erforderlich</p><h1 id="authTitle">Geschützte Marktlücken</h1><p class="intro" id="authIntro">Gib deinen Kundennamen und dein Passwort ein, um freie, unbekannte und weitere geschützte Marktlücken zu sehen.</p><form class="auth-form" id="authForm"><div id="nameField"><label for="name">Kundenname</label><input id="name" autocomplete="username"></div><div><label for="password">Passwort</label><input id="password" type="password" autocomplete="current-password" required></div><button class="auth-button" type="submit">Zugang öffnen →</button><p class="auth-message" id="authMessage"></p></form><p class="login-copyright" id="adminTrigger" title="© Marktlücken.de">© 2026 Marktlücken.de</p></section></main><footer><a href="index.html">Marktlücken.de</a><a href="explore.html">Marktlücken.explore</a><span>© 2026 Marktlücken.de</span></footer><script src="auth.js?v=8"></script><script src="script.js"></script><script>let mode='customer';const form=document.getElementById('authForm'),msg=document.getElementById('authMessage'),nameField=document.getElementById('nameField'),title=document.getElementById('authTitle'),intro=document.getElementById('authIntro'),name=document.getElementById('name'),password=document.getElementById('password'),adminTrigger=document.getElementById('adminTrigger');function setMode(m){mode=m;const admin=m==='admin';nameField.hidden=admin;name.required=!admin;title.textContent=admin?'Administration':'Geschützte Marktlücken';intro.textContent=admin?'Geschützter Administrationszugang.':'Gib deinen Kundennamen und dein Passwort ein, um freie, unbekannte und weitere geschützte Marktlücken zu sehen.';password.value='';msg.textContent='';if(admin)password.focus()}if(new URLSearchParams(location.search).get('admin')==='1')setMode('admin');adminTrigger.onclick=()=>{if(mode==='admin'){setMode('customer');history.replaceState({},'', 'login.html')}else{setMode('admin');history.replaceState({},'', 'login.html?admin=1')}};form.onsubmit=async e=>{e.preventDefault();msg.textContent='Anmeldung …';try{const data=await mlApi(mode==='admin'?'login-admin':'login-customer',mode==='admin'?{password:password.value}:{name:name.value.trim(),password:password.value});mlSetSession(data);location.href=mode==='admin'?'admin.html':'explore.html'}catch(err){msg.textContent=err.message||'Anmeldung fehlgeschlagen.'}};</script></body></html>
