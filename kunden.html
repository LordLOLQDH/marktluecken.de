<!doctype html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kundenbereich · Marktlücken.de</title><link rel="icon" href="favicon.ico"><link rel="stylesheet" href="style.css?v=6"></head><body><header class="header"><a class="logo" href="index.html">Marktlücken<span>.de</span></a><button class="menu-button" id="menuButton">☰</button><nav class="menu" id="menu" aria-hidden="true"><a href="explore.html">Marktlücken.explore</a><a href="kunden.html">Kundenbereich</a></nav></header><main><section class="hero"><p class="eyebrow">Kundenbereich</p><h1>Willkommen, <span id="customerName">Kunde</span>.</h1><p class="intro">Hier findest du alle freigeschalteten Marktlücken und deine Nachrichten.</p><a class="explore-button explore-button-main" href="explore.html"><span>Marktlücken.explore</span><span class="explore-arrow">→</span></a></section><section class="submit-section"><p class="eyebrow">Nachrichten</p><h2>Deine Nachrichten</h2><div id="messages"><p>Lade Nachrichten …</p></div></section></main><footer><a href="index.html">Marktlücken.de</a><a href="explore.html">Marktlücken.explore</a><button class="danger-button" onclick="mlLogout()">Abmelden</button></footer><script src="auth.js"></script><script src="script.js"></script><script>(async()=>{if(!mlIsCustomer()){location.replace('login.html');return}const s=mlSession();document.getElementById('customerName').textContent=s.customer?.name||'Kunde';const box=document.getElementById('messages');try{const d=await mlApi('customer-messages');box.innerHTML=d.messages.length?d.messages.map(m=>`<article class="card"><small>${new Date(m.created_at).toLocaleString('de-DE')}</small><p>${mlEscape(m.message)}</p></article>`).join(''):'<p>Noch keine Nachrichten.</p>'}catch(e){box.innerHTML=`<p>${mlEscape(e.message)}</p>`}})()</script></body></html>
