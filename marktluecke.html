<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Details zu einer Marktlücke auf Marktlücken.de.">
  <title>Marktlücke · Marktlücken.de</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <a class="logo" href="index.html" aria-label="Marktlücken.de Startseite">Marktlücken<span>.de</span></a>
    <button class="menu-button" id="menuButton" aria-label="Menü öffnen" aria-expanded="false">☰</button>
    <nav class="menu" id="menu" aria-hidden="true">
      <a href="index.html">Marktlücken.de</a>
      <a href="explore.html">Marktlücken.explore</a>
      <a href="explore.html#kategorien">Alle Marktlücken</a>
      <a href="index.html#neu">Marktlücke einreichen</a>
    </nav>
  </header>

  <main>
    <section class="hero detail-hero">
      <a class="back-link" href="explore.html">← Zurück zu Marktlücken.explore</a>
      <p class="eyebrow" id="detailTag">Marktlücke</p>
      <h1 id="detailTitle">Marktlücke</h1>
      <p class="intro" id="detailDescription"></p>
    </section>

    <section class="submit-section detail-content">
      <p class="eyebrow">Die Idee</p>
      <h2>Was könnte daraus entstehen?</h2>
      <p id="detailLongDescription"></p>
      <a class="explore-button explore-button-main" href="index.html#neu">
        <span>Eigene Marktlücke einreichen</span>
        <span class="explore-arrow">→</span>
      </a>
    </section>
  </main>

  <footer>
    <a href="index.html">Marktlücken.de</a>
    <a href="explore.html">Marktlücken.explore</a>
  </footer>

  <script src="script.js"></script>
  <script>
    const ideas = {
      toskana: {
        title: 'Toskana-Limonade',
        tag: 'Essen & Getränke · Toskana',
        description: 'Eine regionale Limonade als lokale Alternative zu klassischen Softdrinks – produziert und verkauft in der Toskana.',
        longDescription: 'Eine eigene Limonadenmarke könnte regionale Zutaten, lokale Produktion und den Charakter der Toskana verbinden. Dadurch entsteht ein Produkt, das für Einheimische und Touristen interessant sein könnte.'
      },
      ebike: {
        title: 'E-Bike-Akku-Tauschstationen',
        tag: 'Mobilität',
        description: 'Stationen, an denen leer gefahrene E-Bike-Akkus schnell gegen geladene Akkus getauscht werden können.',
        longDescription: 'Ein dichtes Netz von Akku-Tauschstationen könnte längere Fahrradtouren einfacher machen. Besonders an Bahnhöfen, Rastplätzen und beliebten Radwegen könnten solche Stationen sinnvoll sein.'
      },
      fruehstueck: {
        title: 'Frühstück für Frühreisende',
        tag: 'Reisen & Hotels',
        description: 'Hotels könnten Gästen mit sehr früher Abreise ein einfaches Frühstückspaket zum Mitnehmen anbieten.',
        longDescription: 'Ein vorbereitetes Frühstückspaket könnte Gästen helfen, die vor den normalen Frühstückszeiten abreisen. Das Angebot wäre einfach umzusetzen und könnte den Hotelservice deutlich verbessern.'
      },
      sitzplaetze: {
        title: 'Mehr Sitzplätze in Innenstädten',
        tag: 'Stadt & Alltag',
        description: 'Flexible, gut platzierte Sitzmöglichkeiten für Menschen, die beim Einkaufen oder Warten kurz Pause machen möchten.',
        longDescription: 'Temporäre oder fest installierte Sitzmöglichkeiten könnten Innenstädte angenehmer machen. Besonders für ältere Menschen, Familien und Menschen mit längeren Wartezeiten wäre zusätzlicher Platz zum Ausruhen hilfreich.'
      }
    };

    const id = new URLSearchParams(window.location.search).get('id');
    const idea = ideas[id];

    if (!idea) {
      window.location.replace('404.html');
    } else {
      document.title = `${idea.title} · Marktlücken.de`;
      document.getElementById('detailTag').textContent = idea.tag;
      document.getElementById('detailTitle').textContent = idea.title;
      document.getElementById('detailDescription').textContent = idea.description;
      document.getElementById('detailLongDescription').textContent = idea.longDescription;
    }
  </script>
</body>
</html>
