  <script>
    const ideas = {
      toskana:{title:'Toskana-Limonade',tag:'Essen & Getränke · Toskana',description:'Eine regionale Limonade als lokale Alternative zu klassischen Softdrinks – produziert und verkauft in der Toskana.',longDescription:'Eine eigene Limonadenmarke könnte regionale Zutaten, lokale Produktion und den Charakter der Toskana verbinden. Dadurch entsteht ein Produkt, das für Einheimische und Touristen interessant sein könnte.'},
      ebike:{title:'E-Bike-Akku-Tauschstationen',tag:'Mobilität',description:'Stationen, an denen leer gefahrene E-Bike-Akkus schnell gegen geladene Akkus getauscht werden können.',longDescription:'Ein dichtes Netz von Akku-Tauschstationen könnte längere Fahrradtouren einfacher machen. Besonders an Bahnhöfen, Rastplätzen und beliebten Radwegen könnten solche Stationen sinnvoll sein.'},
      fruehstueck:{title:'Frühstück für Frühreisende',tag:'Reisen & Hotels',description:'Hotels könnten Gästen mit sehr früher Abreise ein einfaches Frühstückspaket zum Mitnehmen anbieten.',longDescription:'Ein vorbereitetes Frühstückspaket könnte Gästen helfen, die vor den normalen Frühstückszeiten abreisen. Das Angebot wäre einfach umzusetzen und könnte den Hotelservice deutlich verbessern.'},
      sitzplaetze:{title:'Mehr Sitzplätze in Innenstädten',tag:'Stadt & Alltag',description:'Flexible, gut platzierte Sitzmöglichkeiten für Menschen, die beim Einkaufen oder Warten kurz Pause machen möchten.',longDescription:'Temporäre oder fest installierte Sitzmöglichkeiten könnten Innenstädte angenehmer machen. Besonders für ältere Menschen, Familien und Menschen mit längeren Wartezeiten wäre zusätzlicher Platz zum Ausruhen hilfreich.'},
      retoure:{title:'Retoure-Abholung im Wohnviertel',tag:'Onlinehandel',description:'Ein gemeinsamer Abholservice könnte Retouren mehrerer Nachbarn gesammelt zur Post oder zum Händler bringen.',longDescription:'Statt dass jeder eine einzelne Retoure zur Paketstation bringt, könnte ein lokaler Abholservice mehrere Sendungen bündeln. Das spart Wege und könnte besonders für Menschen ohne Auto praktisch sein.'},
      werkzeug:{title:'Werkzeug-Bibliothek',tag:'Nachbarschaft',description:'Eine lokale Leihstation für Bohrmaschinen, Leitern und selten benötigtes Werkzeug.',longDescription:'Viele Werkzeuge werden nur wenige Male im Jahr gebraucht. Eine gut organisierte Leihstation könnte Anschaffungskosten und Platz sparen und gleichzeitig Nachbarschaften besser vernetzen.'},
      abendessen:{title:'Mini-Supermarkt für ein einzelnes Abendessen',tag:'Einzelhandel',description:'Ein kleiner Laden oder Automat, der genau die Zutaten für einfache Gerichte in passenden Mengen anbietet.',longDescription:'Statt große Packungen kaufen zu müssen, könnten Kunden Zutaten portionsweise zusammenstellen. Das wäre besonders für Einzelpersonen und spontane Mahlzeiten interessant und könnte Lebensmittelabfälle reduzieren.'},
      regenschirm:{title:'Regenschirm-Verleih',tag:'Stadt & Alltag',description:'Günstige Leihschirme an Bahnhöfen und Innenstadt-Standorten, die an anderen Stationen zurückgegeben werden können.',longDescription:'Ein Stationssystem für Regenschirme könnte spontane Käufe vermeiden. Ein kleiner Pfandbetrag und Rückgabestationen an zentralen Orten würden das Modell einfach und flexibel machen.'},
      pflanzen:{title:'Pflanzen-Sitting in der Nachbarschaft',tag:'Service',description:'Eine einfache Plattform für Menschen, die während Urlauben ihre Pflanzen von jemandem aus der Nähe versorgen lassen möchten.',longDescription:'Pflanzen brauchen oft nur gelegentliche Pflege. Eine lokale Vermittlung könnte Urlauber mit zuverlässigen Menschen aus der Nachbarschaft zusammenbringen und daraus einen kleinen Service machen.'},
      schluessel:{title:'Lokaler Schlüssel-Finder',tag:'Alltag',description:'Ein lokales System, das gefundene Schlüssel anonym mit einem sicheren Code dem Besitzer zuordnen kann.',longDescription:'Ein kleiner Code am Schlüsselbund könnte auf eine sichere Fundseite führen. Der Finder müsste keine persönlichen Daten sehen und der Besitzer könnte trotzdem benachrichtigt werden.'},
      minipotion:{title:'Kleine Portionen auf Abruf',tag:'Essen & Getränke',description:'Restaurants könnten spontane Mini-Portionen aus vorhandenen Zutaten anbieten und damit Lebensmittelverschwendung reduzieren.',longDescription:'Eine zusätzliche kleine Portionsgröße könnte Restmengen sinnvoll nutzen. Kunden könnten neue Gerichte ausprobieren, während Restaurants mehr ihrer vorhandenen Zutaten verkaufen.'},
      parkplatz:{title:'Private Parkplätze auf Zeit',tag:'Mobilität',description:'Eine einfache Vermittlung für private Stellplätze, die nur dann angeboten werden, wenn sie gerade ungenutzt sind.',longDescription:'Viele private Stellplätze stehen tagsüber leer. Eine zeitbasierte Vermittlung könnte diese Flächen kurzfristig nutzbar machen und Parkplatzsuchenden eine zusätzliche Option geben.'},
      spielzeug:{title:'Spielzeug-Flatrate',tag:'Familie',description:'Familien könnten Spielzeug regelmäßig tauschen, statt immer neue Sachen zu kaufen, die nach kurzer Zeit langweilig werden.',longDescription:'Eine monatliche Spielzeug-Flatrate könnte Familien regelmäßig neue Spielsachen bringen. Das alte Spielzeug wird zurückgegeben, geprüft und an die nächste Familie weitergegeben.'},
      bueroessen:{title:'Büro-Mittagessen nach Wunsch',tag:'Arbeit',description:'Teams könnten ihre Mittagswünsche sammeln und automatisch eine passende Sammelbestellung bei lokalen Anbietern auslösen.',longDescription:'Eine gemeinsame Bestellplattform könnte einzelne Bestellungen bündeln. Lokale Restaurants erhalten eine größere Bestellung und Mitarbeiter müssen nicht einzeln organisieren, was sie essen möchten.'},
      koffer:{title:'Koffer-Vorabendservice',tag:'Reisen',description:'Ein Service, der Gepäck am Abend vor der Reise abholt und sicher zum Bahnhof oder Flughafen bringt.',longDescription:'Wer früh am Morgen reist, könnte den Koffer bereits am Vorabend abholen lassen. So wird die Fahrt zum Bahnhof oder Flughafen einfacher und Reisende müssen ihr schweres Gepäck nicht durchgehend tragen.'},
      ladegeraet:{title:'Ladegerät-Verleih in Hotels',tag:'Reisen & Technik',description:'Hotels könnten universelle Ladegeräte und Kabel unkompliziert gegen Pfand ausleihen.',longDescription:'Vergessene Kabel gehören zu den typischen kleinen Reiseproblemen. Ein standardisiertes Leihsystem an der Rezeption könnte Gästen schnell helfen, ohne dass sie extra ein neues Ladegerät kaufen müssen.'},
      waschmaschine:{title:'Gemeinsame Waschmaschinen auf Abruf',tag:'Wohnen',description:'Eine Buchungsplattform könnte freie Waschmaschinen in Wohnhäusern sichtbar und zeitlich buchbar machen.',longDescription:'In Wohnhäusern mit gemeinsam genutzten Waschmaschinen entstehen häufig Wartezeiten und Missverständnisse. Eine einfache digitale Buchung könnte freie Zeiten sichtbar machen und die Nutzung fairer organisieren.'},
      schuhe:{title:'Schuh-Reparatur mit Abholung',tag:'Nachhaltigkeit',description:'Kaputte Schuhe werden zu Hause abgeholt, repariert und wieder zurückgebracht.',longDescription:'Viele Menschen ersetzen Schuhe, obwohl eine Reparatur noch möglich wäre. Ein Abhol- und Bringservice könnte Reparaturen bequemer machen und lokalen Schuhmachern zusätzliche Aufträge vermitteln.'},
      buecher:{title:'Bücher-Tauschbox mit App',tag:'Kultur',description:'Lokale Bücherboxen könnten per einfacher App anzeigen, welche Bücher gerade verfügbar sind.',longDescription:'Eine digitale Übersicht würde aus einzelnen Tauschboxen ein kleines lokales Netzwerk machen. Nutzer könnten vor dem Weg sehen, ob sich ein Besuch lohnt, und Bücher leichter weitergeben.'},
      warteschlange:{title:'Digitale Warteschlange für kleine Geschäfte',tag:'Service',description:'Menschen könnten sich aus der Ferne anstellen und erst kurz vor ihrem Termin zum Geschäft kommen.',longDescription:'Kleine Geschäfte, Werkstätten oder Beratungsstellen könnten eine einfache digitale Warteschlange anbieten. Kunden verlieren weniger Zeit und das Personal kann den Andrang besser einschätzen.'}
    };
    const id = new URLSearchParams(window.location.search).get('id');
    const idea = ideas[id];
    if (!idea) window.location.replace('404.html');
    else {
      document.title = `${idea.title} · Marktlücken.de`;
      document.getElementById('detailTag').textContent = idea.tag;
      document.getElementById('detailTitle').textContent = idea.title;
      document.getElementById('detailDescription').textContent = idea.description;
      document.getElementById('detailLongDescription').textContent = idea.longDescription;
    }
  </script>
