<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Details zu einer Marktlücke auf Marktlücken.de.">
  <title>Marktlücke · Marktlücken.de</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <header class="header">
    <a class="logo" href="index.html" aria-label="Marktlücken.de Startseite">Marktlücken<span>.de</span></a>
    <button class="menu-button" id="menuButton" aria-label="Menü öffnen" aria-expanded="false">☰</button>
    <nav class="menu" id="menu" aria-hidden="true">
      <a href="index.html">Marktlücken.de</a><a href="explore.html">Marktlücken.explore</a><a href="explore.html#kategorien">Alle Marktlücken</a><a href="index.html#neu">Marktlücke einreichen</a>
    </nav>
  </header>
  <main>
    <section class="hero detail-hero">
      <a class="back-link" href="explore.html">← Zurück zu Marktlücken.explore</a>
      <p class="eyebrow" id="detailTag">Marktlücke</p>
      <h1 id="detailTitle">Marktlücke</h1>
      <p class="intro" id="detailDescription"></p>
    </section>
    <section class="submit-section detail-content">
      <p class="eyebrow">Die Idee</p><h2>Was könnte daraus entstehen?</h2><p id="detailLongDescription"></p>
      <div class="status-panel">
        <div><p class="status-label">Aktueller Status</p><span id="detailStatusBadge" class="status-badge status-unknown">Unbekannt</span></div>
        <label class="status-editor" for="detailStatus"><span>Status ändern</span><select id="detailStatus"><option value="unknown">Unbekannt</option><option value="free">Frei</option><option value="development">In Entwicklung</option><option value="used">In Benutzung</option></select></label>
        <button class="explore-button status-save-button" id="saveStatus" type="button">Status speichern →</button>
        <p class="status-message" id="statusMessage" role="status" aria-live="polite"></p>
      </div>
      <a class="explore-button explore-button-main" href="index.html#neu"><span>Eigene Marktlücke einreichen</span><span class="explore-arrow">→</span></a>
    </section>
  </main>
  <footer><a href="index.html">Marktlücken.de</a><a href="explore.html">Marktlücken.explore</a></footer>
  <script src="ideas.js"></script><script src="script.js"></script>
  <script>
    const SUPABASE_URL='https://rgdnhcmeuhkyltzpbola.supabase.co';
    const SUPABASE_KEY='sb_publishable_glmpXsPENr7rftV-FSdq2w_k9vknOhI';
    const STATUS_LABELS={unknown:'Unbekannt',free:'Frei',development:'In Entwicklung',used:'In Benutzung'};
    const id=new URLSearchParams(location.search).get('id');
    const idea=MARKTLUECKEN_IDEAS.find(item=>item.id===id);
    const statusBadge=document.getElementById('detailStatusBadge'),statusSelect=document.getElementById('detailStatus'),saveButton=document.getElementById('saveStatus'),statusMessage=document.getElementById('statusMessage');
    function setStatus(status){const value=STATUS_LABELS[status]?'': 'unknown';const safeStatus=STATUS_LABELS[status]?status:'unknown';statusBadge.textContent=STATUS_LABELS[safeStatus];statusBadge.className=`status-badge status-${safeStatus}`;statusSelect.value=safeStatus;}
    async function loadStatus(){try{const response=await fetch(`${SUPABASE_URL}/rest/v1/marktluecken?id=eq.${encodeURIComponent(id)}&select=status`,{headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`}});if(!response.ok)throw new Error('Status konnte nicht geladen werden');const rows=await response.json();setStatus(rows[0]?.status||'unknown');}catch(error){setStatus('unknown');statusMessage.textContent='Status konnte nicht geladen werden.';statusMessage.className='status-message error';}}
    async function saveStatus(){const status=statusSelect.value;saveButton.disabled=true;statusMessage.textContent='Speichert …';statusMessage.className='status-message';try{const response=await fetch(`${SUPABASE_URL}/rest/v1/marktluecken`,{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`, 'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({id,status})});if(!response.ok)throw new Error('Speichern fehlgeschlagen');setStatus(status);statusMessage.textContent='Status gespeichert. Er gilt jetzt für alle Besucher.';statusMessage.className='status-message success';}catch(error){statusMessage.textContent='Status konnte nicht gespeichert werden.';statusMessage.className='status-message error';}finally{saveButton.disabled=false;}}
    if(!idea){location.replace('404.html');}else{document.title=`${idea.title} · Marktlücken.de`;document.getElementById('detailTag').textContent=idea.tag;document.getElementById('detailTitle').textContent=idea.title;document.getElementById('detailDescription').textContent=idea.description;document.getElementById('detailLongDescription').textContent=idea.longDescription;loadStatus();}
    saveButton.addEventListener('click',saveStatus);
  </script>
</body>
</html>
